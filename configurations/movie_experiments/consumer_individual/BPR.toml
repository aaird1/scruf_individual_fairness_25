[location]
path = "../../../post_processing/data/movies/"
overwrite = "true"

[data]
rec_filename = "ml-1m_fold1_BPR_test_recommendations.csv"
feature_filename = "items.csv"

[output]
filename = "ml-1m_fold1_BPR_ind"
dnc = "true"

[parameters]
list_size = 10
iterations = -1
initialize = "skip"
history_window_size = 200

[context]
context_class = "csv_context"

[choice]
choice_class = "weighted_scoring"

[post]
postprocess_class = "null"

[context.properties]
compatibility_file = "movies_individual_compat_80.csv"
popularity_data = "popularity_1m.csv"

[feature.one]
name = "consumer_individual"
protected_feature = "consumer_individual"
protected_values = [ 1,]

[feature.two]
name = "non-en"
protected_feature = "non-en"
protected_values = [ 1,]

[feature.three]
name = "women_writer_director"
protected_feature = "women_writer_director"
protected_values = [ 1,]


[agent.one]
name = "consumer_individual"
metric_class = "consumer_individual"
compatibility_class = "context_compatibility"
preference_function_class = "original_recs"

[agent.two]
name = "non-en"
metric_class = "proportional_item"
compatibility_class = "context_compatibility"
preference_function_class = "cascade_preference"

[agent.three]
name = "women_writer_director"
metric_class = "proportional_item"
compatibility_class = "context_compatibility"
preference_function_class = "cascade_preference"

[allocation]
allocation_class = "weighted_product_allocation"

[allocation.properties]


[choice.properties]
recommender_weight = 0.1



[agent.one.metric]
feature = "individual_consumer"
other_features = "female"
[agent.one.preference]


[agent.two.metric]
feature = "non-en"
proportion = 0.07

[agent.two.preference]
delta = 3
feature = "non-en"

[agent.three.metric]
feature = "women_writer_director"
proportion = 0.50

[agent.three.preference]
delta = 0.5
feature = "women_writer_director"