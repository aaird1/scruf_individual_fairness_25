[location]
path = "../../../post_processing/data/music/"
overwrite = "true"

[data]
rec_filename = "ambar_fold1_BPR_test_recommendations.csv"
feature_filename = "ambar_items.csv"

[output]
filename = "ambar_fold1_BPR_individual.csv_weighted_scoring_product_lottery_0.2_fold1.json"
dnc = "true"

[parameters]
list_size = 10
iterations = -1
initialize = "skip"
history_window_size = 500

[context]
context_class = "csv_context"

[choice]
choice_class = "weighted_scoring"

[post]
postprocess_class = "null"

[allocation]
allocation_class = "product_lottery"

[context.properties]
compatibility_file = "ambar_individual_compat.csv"
popularity_data = "popularity_ambar.csv"

[choice.properties]
recommender_weight = 0.2

[feature.one]
name = "consumer_individual"
protected_feature = "consumer_individual"
protected_values = [ 1,]

[feature.two]
name = "female"
protected_feature = "female"
protected_values = [ 1,]

[agent.one]
name = "consumer_individual"
metric_class = "consumer_individual"
compatibility_class = "context_compatibility"
preference_function_class = "original_recs"

[agent.two]
name = "female"
metric_class = "proportional_item"
compatibility_class = "context_compatibility"
preference_function_class = "cascade_preference"

[allocation.properties]

[agent.one.metric]
feature = "individual_consumer"
other_features = "female"

[agent.one.preference]

[agent.two.metric]
feature = "female"
proportion = 0.5

[agent.two.preference]
delta = 50
feature = "female"
