[location]
path = "../../../post_processing/data/kiva/"
overwrite = "true"

[data]
rec_filename = "kiva_fold1_MultiVAE_test_recommendations.csv"
feature_filename = "loans.csv"

[output]
filename = "kiva_baseline_vae"
dnc = "true"

[parameters]
list_size = 10
iterations = -1
initialize = "skip"
history_window_size = 800

[context]
context_class = "csv_context"

[choice]
choice_class = "weighted_scoring"

[post]
postprocess_class = "null"

[context.properties]
compatibility_file = "compat_kiva.csv"
popularity_data = "popularity_kiva.csv"

[feature.one]
name = "tail"
protected_feature = "tail"
protected_values = [ 1,]

[feature.two]
name = "high"
protected_feature = "high"
protected_values = [ 1,]

[feature.three]
name = "agriculture"
protected_feature = "agriculture"
protected_values = [ 1,]

[agent.one]
name = "tail"
metric_class = "gini"
compatibility_class = "context_compatibility"
preference_function_class = "ind_exponential"

[agent.two]
name = "high"
metric_class = "proportional_item"
compatibility_class = "context_compatibility"
preference_function_class = "cascade_preference"

[agent.three]
name = "agriculture"
metric_class = "proportional_item"
compatibility_class = "context_compatibility"
preference_function_class = "cascade_preference"

[allocation]
allocation_class = "static_lottery"

[allocation.properties]
weights = [["high", "0.0"], ["tail", "0.0"], ["agriculture", "0.0"]]

[choice.properties]
recommender_weight = 0.6


[agent.one.metric]
target = 0.5
num_items = 8023

[agent.one.preference]
delta = 0.5


[agent.two.metric]
feature = "high"
proportion = 0.30

[agent.two.preference]
delta = 0.5
feature = "high"

[agent.three.metric]
feature = "agriculture"
proportion = 0.30

[agent.three.preference]
delta = 0.5
feature = "agriculture"